<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="formstyle.css" />
    <title>Form</title>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="title">Registration Form</div>
      </header>
      <div class="input">
        <div class="info-name">First Name:</div>
        <input type="text" required />
      </div>
      <div class="input">
        <div class="info-name">Last Name:</div>
        <input type="text" required />
      </div>
      <div class="input">
        <div class="info-name">Email:</div>
        <input type="text" required />
      </div>
      <div class="input">
        <div class="info-name">Password:</div>
        <input type="text" required />
      </div>
      <div class="input">
        <div class="info-name">Confirm Password:</div>
        <input type="text" required />
      </div>
      <div class="input">
        <div class="info-name">Contact:</div>
        <input type="text" required />
      </div>
      <div class="input">
        <div class="info-name">Gender:</div>
        <input type="text" required />
      </div>
      <button class="btn">
        <div class="sub">Submit</div>
      </button>
    </div>
  </body>
</html>
